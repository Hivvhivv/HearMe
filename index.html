<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <title>HearMe</title>
    <link rel="icon" type="image/png" href="src/data/logo.png" />

    <meta

      content="HearMe membantu kamu menjaga kesehatan mental lewat pencatatan mood, jurnal digital, konsultasi dengan psikolog, dan pustaka konten self-care."

    <!--
      JANGAN DIINDEKS.

      Selama masih tahap pengembangan, situs ini minta mesin
      pencari untuk tidak mengindeksnya. Dipasang di dua
      tempat karena keduanya mengerjakan hal berbeda:

        - meta di bawah  : untuk halaman yang sudah dibuka
        - public/robots.txt : untuk crawler sebelum membuka

      Saat siap dirilis ke publik, hapus meta robots di bawah
      DAN ubah isi public/robots.txt. Kalau hanya salah satu
      yang diubah, situs tetap tidak muncul di Google.
    -->
    <meta name="robots" content="noindex, nofollow" />

    <meta property="og:title" content="HearMe" />
    <meta
      property="og:description"
      content="HearMe membantu kamu menjaga kesehatan mental lewat pencatatan mood, jurnal digital, konsultasi dengan psikolog, dan pustaka konten self-care."
    />
    <meta property="og:type" content="website" />
  </head>
